<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taegabi Studio</title>
  <meta name="description" content="Taegabi Studio는 포포 비트, 픽앤필 같은 작고 즐거운 앱을 만듭니다.">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    :root { --paper: #fff6dc; --card: #fffdf6; --ink: #1d1530; --dim: rgba(29,21,48,.65); --accent: #ef476f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.7 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 72px 20px 48px; }
    h1 { font-size: 40px; margin: 0 0 6px; }
    p { color: var(--dim); margin: 0 0 32px; }
    .apps { display: grid; gap: 16px; }
    a.app { display: block; padding: 18px 22px; background: var(--card); border: 2.5px solid var(--ink); border-radius: 16px; color: var(--ink); text-decoration: none; box-shadow: 4px 5px 0 rgba(29,21,48,.12); }
    a.app:hover { border-color: var(--accent); }
    a.app strong { font-size: 20px; }
    a.app span { display: block; color: var(--dim); font-size: 15px; }
    footer { max-width: 720px; margin: 0 auto; padding: 0 20px 40px; color: var(--dim); font-size: 14px; }
    footer a { color: var(--dim); }
  </style>
</head>
<body>
<main>
  <h1>Taegabi Studio</h1>
  <p>작고 즐거운 앱을 만듭니다. · Small, joyful apps.</p>
  <div class="apps">
    <a class="app" href="https://fourfourbeat.taegabi.com/"><strong>포포 비트 · FourFour Beat</strong><span>하나, 둘, 톡! 박자에 맞춰 터치하는 리듬 미니게임</span></a>
    <a class="app" href="https://picandfill.taegabi.com/"><strong>픽앤필 · Pic&amp;Fill</strong><span>픽앤필 소개 페이지</span></a>
  </div>
</main>
<footer>© 2026 Taegabi Studio · <a href="mailto:contact@taegabi.com">contact@taegabi.com</a></footer>
</body>
</html>
